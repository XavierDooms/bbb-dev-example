# LAYER_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
LCONF_VERSION = "7"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  /workspace/yocto/openembedded-core/meta \
  /workspace/yocto/meta-yocto/meta-poky \
  /workspace/yocto/meta-arm/meta-arm-toolchain \
  /workspace/yocto/meta-arm/meta-arm \
  /workspace/yocto/meta-ti/meta-ti-bsp \
  /workspace/yocto/meta-ti/meta-beagle \
  "
